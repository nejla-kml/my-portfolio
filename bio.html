<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background: linear-gradient(to right,#fdf6e3,#fff8dc);
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
            text-align: center;
        }

        table{
            margin: auto;
            margin-top: 20px;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        th{
            background-color: blueviolet;
            color: white;
            padding: 10px 20px;
        }

        td{
            padding: 10px 20px;
            background-color: #f5f5f5;
        }

        tr:hover td{
            background-color: #e6e6fa;
        }

        video{
            margin-top: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
        }

        .thankyou{
            margin-top: 30px;
            font-size: 20px;
            color: darkgreen;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <table border="5">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Blood Group</th>
            <th>Height</th>
            <th>Weight</th>
        </tr>

        <tr>
            <td>Nejla</td>
            <td>20</td>
            <td>B+</td>
            <td>151 cm</td>
            <td>36 kg</td>
        </tr>
    </table>

    <video width="640" height="360" controls>
        <source src="exercise.mp4" type="video/mp4">
        <source src="exercise.webm" type="video/webm">
        Your browser does not support the video tag.
    </video>

    <p class="thankyou">✨ Thank you for visiting my page! ✨</p>

</body>
</html>
