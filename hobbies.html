<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background: linear-gradient(to right,#fff8dc,#fdf6e3);
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px;
            text-align: center;
        }

        h3{
            color: blueviolet;
            font-size: 28px;
            margin-bottom: 20px;
        }

        ul{
            list-style-type: square;
            display: inline-block;
            text-align: left;
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
        }

        li{
            padding: 5px;
            font-size: 18px;
        }

        img{
            margin-top: 20px;
            width: 250px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        button{
            margin-top: 20px;
            padding: 10px 20px;
            background-color: blueviolet;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover{
            background-color: rgb(89, 66, 174);
        }
    </style>

</head>

<body>

<h3>My Hobbies</h3>

<ul>
    <li>Reading</li>
    <li>Writing</li>
    <li>Crocheting</li>
</ul>

<br>

<img src="images.jpg" alt="My Image">

<br>

<a href="bio.html">
    <button>Health</button>
</a>

</body>
</html>
